<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XuanLing Semantic World Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>翾靈語義世界檢視器</h1>
        <p>同一 Stable Identity 的人類／機器／視覺／認知投影檢查面</p>
      </div>
      <div id="status" class="status">載入中</div>
    </header>

    <nav class="view-nav" aria-label="檢視模式">
      <button type="button" class="view-button active" data-view="world">世界視圖</button>
      <button type="button" class="view-button" data-view="dcp">DCP 認知視圖</button>
    </nav>

    <div id="world-view">
      <section class="summary" id="summary"></section>
      <section class="layout">
        <article class="panel"><h2>世界與主要關係</h2><div id="relations" class="list"></div></article>
        <article class="panel"><h2>Anchor 與漂移檢查</h2><div id="anchors" class="list"></div></article>
      </section>
      <section class="layout">
        <article class="panel"><h2>目前 Hold</h2><div id="holds" class="list"></div></article>
        <article class="panel"><h2>事件生命鏈</h2><div id="events" class="timeline"></div></article>
      </section>
      <section class="panel human-panel"><h2>人類可讀說明</h2><div id="human" class="human-copy"></div></section>
    </div>

    <div id="dcp-view" hidden>
      <section class="summary" id="dcp-summary"></section>
      <section class="layout">
        <article class="panel"><h2>核心依存面</h2><div id="dcp-families" class="list"></div></article>
        <article class="panel"><h2>不得自動推論</h2><div id="dcp-guards" class="list"></div></article>
      </section>
      <section class="layout">
        <article class="panel"><h2>權限與 Gate</h2><div id="dcp-rights" class="list"></div></article>
        <article class="panel"><h2>成長與失敗記憶</h2><div id="dcp-growth" class="list"></div></article>
      </section>
      <section class="panel human-panel"><h2>DCP 人類可讀說明</h2><div id="dcp-human" class="human-copy"></div></section>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
