name: Semantic Core Verify

on:
  push:
    paths:
      - 'semantic-core/**'
      - '.github/workflows/semantic-core-verify.yml'
  pull_request:
    paths:
      - 'semantic-core/**'

permissions:
  contents: read

jobs:
  verify-gui-lu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cross-surface semantic alignment
        run: node semantic-core/tools/verify-specimen.mjs
      - name: Verify DCP semantic core invariants
        run: node semantic-core/tools/verify-dcp-core.mjs
      - name: Verify carrier abstraction invariants
        run: node semantic-core/tools/verify-carriers.mjs
      - name: Snapshot committed projection
        run: cp semantic-core/generated/gui-lu.semantic-view.json /tmp/gui-lu.before.json
      - name: Compile projections from canonical specimen
        run: node semantic-core/tools/compile-projections.mjs
      - name: Verify generated projection semantics are current
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/gui-lu.before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('semantic-core/generated/gui-lu.semantic-view.json','utf8'));
          const normalize=v=>Array.isArray(v)?v.map(normalize):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,normalize(v[k])])):v;
          if(JSON.stringify(normalize(before))!==JSON.stringify(normalize(after))){
            console.error('GENERATED_SEMANTIC_PROJECTION_STALE');
            process.exit(1);
          }
          console.log('GENERATED_SEMANTIC_PROJECTION_CURRENT');
          NODE
