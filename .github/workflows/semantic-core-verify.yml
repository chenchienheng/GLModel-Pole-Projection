name: Semantic Core Verify

on:
  push:
    paths:
      - 'semantic-core/**'
      - 'CURRENT-SURFACE-MANIFEST.json'
      - 'README.md'
      - '.github/workflows/semantic-core-verify.yml'
  pull_request:
    paths:
      - 'semantic-core/**'
      - 'CURRENT-SURFACE-MANIFEST.json'
      - 'README.md'

permissions:
  contents: read

jobs:
  verify-gui-lu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository current-surface manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('CURRENT-SURFACE-MANIFEST.json','utf8'));
          const required=['README.md','CURRENT-SURFACE-MANIFEST.json','semantic-core/index.json','semantic-core/dcp/index.json'];
          if(m.native_source_root!==false){throw new Error('REPOSITORY_MUST_NOT_BECOME_NATIVE_SOURCE_ROOT')}
          for(const p of required){if(!fs.existsSync(p))throw new Error(`CURRENT_SURFACE_POINTER_MISSING:${p}`)}
          if(!Array.isArray(m.legacy_root_families)||!m.legacy_root_families.length){throw new Error('LEGACY_CLASSIFICATION_MISSING')}
          console.log('CURRENT_SURFACE_MANIFEST_OK');
          NODE
      - name: Verify cross-surface semantic alignment
        run: node semantic-core/tools/verify-specimen.mjs
      - name: Verify DCP semantic core invariants
        run: node semantic-core/tools/verify-dcp-core.mjs
      - name: Verify carrier abstraction invariants
        run: node semantic-core/tools/verify-carriers.mjs
      - name: Verify public projection is fail-closed before approval
        run: |
          set +e
          node semantic-core/tools/compile-public-projection.mjs >/tmp/public.out 2>/tmp/public.err
          code=$?
          set -e
          cat /tmp/public.err || true
          if [ "$code" -ne 3 ]; then
            echo "EXPECTED_APPROVAL_REQUIRED_BLOCK_BUT_GOT_EXIT_${code}"
            exit 1
          fi
          grep -q 'PUBLIC_PROJECTION_BLOCKED:APPROVAL_REQUIRED' /tmp/public.err
      - name: Snapshot committed projection
        run: cp semantic-core/generated/gui-lu.semantic-view.json /tmp/gui-lu.before.json
      - name: Compile projections from canonical specimen
        run: node semantic-core/tools/compile-projections.mjs
      - name: Verify generated projection semantics are current
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/gui-lu.before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('semantic-core/generated/gui-lu.semantic-view.json','utf8'));
          const normalize=v=>Array.isArray(v)?v.map(normalize):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,normalize(v[k])])):v;
          if(JSON.stringify(normalize(before))!==JSON.stringify(normalize(after))){
            console.error('GENERATED_SEMANTIC_PROJECTION_STALE');
            process.exit(1);
          }
          console.log('GENERATED_SEMANTIC_PROJECTION_CURRENT');
          NODE
